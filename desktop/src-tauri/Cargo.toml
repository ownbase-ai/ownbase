[package]
name = "ownbase-desktop"
version = "0.1.0"
description = "The OwnBase app"
authors = ["OwnBase"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ownbase_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }

[features]
# Disables the dev-server assumption in release builds.
default = []
