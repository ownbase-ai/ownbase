name: Finish release

# Completes a tag whose GitHub Release already exists but whose follow-on
# steps (bucket publish, app bundles, Homebrew) did not run — e.g. when
# GoReleaser published the release then failed on a soft dependency.
#
# Run from the Actions UI: workflow_dispatch → tag vX.Y.Z.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.5.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-bucket:
    name: Publish daemon bucket + latest.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to releases.ownbase.ai
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.RELEASES_BUCKET_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RELEASES_BUCKET_SECRET_ACCESS_KEY }}
          RELEASES_BUCKET: ${{ secrets.RELEASES_BUCKET_NAME }}
          RELEASES_BUCKET_ENDPOINT: ${{ secrets.RELEASES_BUCKET_ENDPOINT }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASES_BUCKET:-}" ]; then
            echo "RELEASES_BUCKET_NAME secret not set — nothing to publish."
            exit 0
          fi
          chmod +x .github/scripts/publish-daemon-bucket.sh
          .github/scripts/publish-daemon-bucket.sh

  publish-cli-cask:
    name: Homebrew cask (CLI)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Publish ownbasectl cask
        env:
          TAG: ${{ inputs.tag }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_GITHUB_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN not set — skipping."
            exit 0
          fi
          chmod +x .github/scripts/publish-ownbasectl-cask.sh
          .github/scripts/publish-ownbasectl-cask.sh

  app:
    name: App (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple silicon)
            runner: macos-14
            target: aarch64-apple-darwin
          - label: macOS (Intel)
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - label: Linux (x86_64)
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}

      - name: Install Tauri's Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev patchelf libayatana-appindicator3-dev

      - name: npm ci
        working-directory: desktop
        run: npm ci

      - name: Build the bundled ownbasectl
        working-directory: desktop
        env:
          OWNBASE_SIDECAR_TARGET: ${{ matrix.target }}
          OWNBASE_VERSION: ${{ inputs.tag }}
        run: npm run sidecar

      - name: Import the Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain=/tmp/build.keychain
          password=$(uuidgen)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain
          rm -f /tmp/cert.p12

      - name: Stamp the bundle version from the tag
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          jq --arg v "$version" '.version = $v' src-tauri/tauri.conf.json > /tmp/conf.json
          mv /tmp/conf.json src-tauri/tauri.conf.json
          jq -r '"bundling version " + .version' src-tauri/tauri.conf.json
        env:
          TAG: ${{ inputs.tag }}

      - name: Build the bundle
        working-directory: desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for v in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v:-}" ]; then
              unset "$v"
            fi
          done
          npm run tauri -- build --target ${{ matrix.target }}

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          bundle="desktop/src-tauri/target/${TARGET}/release/bundle"
          shopt -s nullglob
          stage=$(mktemp -d)
          for f in "$bundle"/dmg/*.dmg "$bundle"/appimage/*.AppImage "$bundle"/deb/*.deb; do
            ext="${f##*.}"
            cp "$f" "$stage/OwnBase-${VERSION}-${TARGET}.${ext}"
          done
          if [ -z "$(ls -A "$stage")" ]; then
            echo "No bundles found under $bundle" >&2
            find "$bundle" -maxdepth 2 -type f >&2 || true
            exit 1
          fi
          ls -la "$stage"
          gh release upload "$VERSION" "$stage"/* --clobber

  homebrew-app:
    name: Homebrew cask (app)
    needs: app
    runs-on: ubuntu-latest
    if: ${{ success() }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish ownbase cask to homebrew-tap
        env:
          TAG: ${{ inputs.tag }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_GITHUB_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_GITHUB_TOKEN not set — skipping app cask publish."
            exit 0
          fi
          chmod +x .github/scripts/publish-ownbase-cask.sh
          .github/scripts/publish-ownbase-cask.sh
