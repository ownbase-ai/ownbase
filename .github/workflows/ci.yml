name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Tier 1 — host-portable: runs on every push, no Linux VM required.
  tier1:
    name: Tier 1 (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: go test
        run: go test ./...

  # The desktop app. No window is opened, so this is Tier 1: the TypeScript
  # typechecks, the Rust bridge compiles clean, and the frontend bundles. What it
  # is really guarding is the seam between the two halves — the app renders
  # `ownbasectl --json`, and a field that moved on the Go side has to fail here
  # rather than in a shipped bundle.
  desktop:
    name: Desktop app (typecheck + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      # Tauri's Linux build needs GTK and WebKitGTK; `cargo clippy` will not
      # resolve the crate without them even though nothing is displayed.
      - name: Install Tauri's Linux dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev patchelf libayatana-appindicator3-dev

      - name: npm ci
        working-directory: desktop
        run: npm ci

      - name: Typecheck, lint, and test
        working-directory: desktop
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Install Playwright Chromium
        working-directory: desktop
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e (hermetic, mocked IPC)
        working-directory: desktop
        run: npm run e2e

      - name: Build the frontend
        working-directory: desktop
        run: npm run build

      # The Rust side never sees the sidecar's contents, but Tauri refuses to
      # configure a bundle whose declared sidecar is absent, so a stub stands in.
      - name: Stub the sidecar
        working-directory: desktop
        run: |
          mkdir -p src-tauri/binaries
          triple=$(rustc -vV | sed -n 's/^host: //p')
          : > "src-tauri/binaries/ownbasectl-${triple}"
          chmod +x "src-tauri/binaries/ownbasectl-${triple}"

      - name: cargo fmt and clippy
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

  # Optional: real ownbasectl via the e2e bridge. Manual only — needs a built
  # sidecar and is not a PR gate. Catches argv/stdin/exit-code drift against
  # a real binary that the hermetic suite cannot see.
  desktop-e2e-real:
    name: Desktop e2e real CLI (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: npm ci
        working-directory: desktop
        run: npm ci
      - name: Build sidecar
        working-directory: desktop
        run: npm run sidecar
      - name: Install Playwright Chromium
        working-directory: desktop
        run: npx playwright install --with-deps chromium
      - name: Playwright e2e real
        working-directory: desktop
        run: npm run e2e:real

  # Tier 2 — real Ubuntu with Podman + Quadlet + systemd. Runs on push to
  # main and on pull requests targeting main; also runnable manually.
  # Required from M3 onward; harmless before (no integration tests yet).
  tier2:
    name: Tier 2 (integration)
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Enable linger (rootless user systemd session)
        run: sudo loginctl enable-linger "$USER"

      - name: Wait for user systemd session
        run: |
          # XDG_RUNTIME_DIR is not set in non-interactive CI shells; set it
          # explicitly so systemctl --user can reach the session D-Bus socket.
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          # Wait up to 30 s for the user session bus to appear (loginctl
          # enable-linger starts the session asynchronously).
          for i in $(seq 1 30); do
            if systemctl --user is-system-running 2>/dev/null | grep -qE "^(running|degraded)$"; then
              echo "user systemd session ready after ${i}s"
              break
            fi
            sleep 1
          done
          systemctl --user status --no-pager 2>&1 | head -10 || true

      - name: Pre-pull test image (avoids 15 s timeout on first container start)
        run: podman pull docker.io/library/alpine:latest

      - name: Install test tools (skopeo for image-digest tests, restic for backup tests)
        run: sudo apt-get install -y skopeo restic

      - name: go test (integration)
        run: go test -tags=integration -timeout 30m ./...

  # Tier 2 root — same Ubuntu 24.04 VM but runs install + bootstrap tests as
  # root. These tests use rootful Podman (install-level operations, UFW).
  # Each job gets a fresh VM so there is no conflict with the rootless
  # tier2 job above.
  tier2-root:
    name: Tier 2 root (install + bootstrap)
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go test (integration, root)
        # -p 1 forces sequential execution so PassZero (install) finishes
        # before secwatch probes for ufw/fail2ban.
        run: sudo env "PATH=$PATH" go test -tags=integration -timeout 30m -p 1 ./internal/install/... ./internal/secwatch/... -v
